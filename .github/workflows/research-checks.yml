name: Research integrity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check experiment Python syntax
        run: python3 -m py_compile experiments/admission-contract/*.py
      - name: Check audit phase accounting
        run: python3 -m unittest discover -s experiments/admission-contract -p 'test_*.py'
      - name: Check experiment shell syntax
        run: bash -n scripts/check-research.sh experiments/admission-contract/prepare-assets.sh
      - name: Run unit tests
        run: go test -race -count=1 ./...
      - name: Check required research artifacts
        shell: bash
        run: bash scripts/check-research.sh
